services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://server:7020
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-}"
        NEXT_PUBLIC_BLOG_URL: "${NEXT_PUBLIC_BLOG_URL:-}"
        NEXT_PUBLIC_GITHUB_URL: "${NEXT_PUBLIC_GITHUB_URL:-}"
        NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-}"
        NEXT_PUBLIC_SITE_DESCRIPTION: "${NEXT_PUBLIC_SITE_DESCRIPTION:-}"
        SITE_NAME: "${SITE_NAME:-}"
        SITE_DESCRIPTION: "${SITE_DESCRIPTION:-}"
    environment:
      API_BASE_URL: http://server:7020
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-}"
      NEXT_PUBLIC_BLOG_URL: "${NEXT_PUBLIC_BLOG_URL:-}"
      NEXT_PUBLIC_GITHUB_URL: "${NEXT_PUBLIC_GITHUB_URL:-}"
      NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-}"
      NEXT_PUBLIC_SITE_DESCRIPTION: "${NEXT_PUBLIC_SITE_DESCRIPTION:-}"
      SITE_NAME: "${SITE_NAME:-}"
      SITE_DESCRIPTION: "${SITE_DESCRIPTION:-}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_ADDR: redis:6379
      SERVER_PORT: "7020"
      WEB_ORIGIN: http://localhost
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1,::1}"
    volumes:
      - ../.env:/app/.env
    expose:
      - "7020"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7020/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
